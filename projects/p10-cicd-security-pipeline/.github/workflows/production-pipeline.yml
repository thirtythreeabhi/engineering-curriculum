name: Production Secure CI/CD Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write # Required for Azure OIDC Workload Identity

jobs:
  # Stage 1: Linting and Code Style
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Run Python Linters (Ruff / Flake8)
        run: |
          pip install ruff flake8
          ruff check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # Stage 2: Unit & Integration Testing
  test:
    name: Unit & Integration Tests
    needs: [lint-and-format]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Test Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Test Suite with Coverage Gate
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-fail-under=80

  # Stage 3: SAST with Semgrep
  sast-semgrep:
    name: SAST Code Security (Semgrep)
    needs: [test]
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute Semgrep SAST Scan
        run: semgrep scan --config=.semgrep.yml --error --sarif --output=semgrep.sarif

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # Stage 4: Container Vulnerability Scanning with Trivy
  container-scan-trivy:
    name: Container Scan (Trivy)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Local Container Image
        run: docker build -t app:local .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "app:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  # Stage 5: SBOM Generation with Syft
  sbom-syft:
    name: SBOM Generation (Syft)
    needs: [container-scan-trivy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Software Bill of Materials (SPDX / CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: app:local
          output-file: app-sbom.spdx.json
          format: spdx-json

      - name: Archive SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: app-sbom.spdx.json

  # Stage 6: Automated Canary Deployment
  canary-deploy:
    name: Canary Deployment & Verification
    needs: [sast-semgrep, container-scan-trivy, sbom-syft]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy Canary (10% Traffic Routing)
        run: |
          echo "Deploying canary version with weighted routing (10% traffic)..."
          # kubectl apply -f k8s/canary-deployment.yaml

      - name: Automated Synthetic Health & Latency Probe
        run: |
          echo "Probing canary endpoint for 3 minutes..."
          # Python verification script checking 5xx rates < 0.1% and p95 latency < 150ms
          python scripts/verify_canary.py --threshold-p95=150 --max-error-rate=0.001

      - name: Promote Canary to 100%
        if: success()
        run: echo "Canary passed all synthetic SLO checks. Promoting to 100% production traffic."

      - name: Automated Rollback on Canary Failure
        if: failure()
        run: echo "Canary tripped latency or error budget! Rolling back traffic to stable baseline."
