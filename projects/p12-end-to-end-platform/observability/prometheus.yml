global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "php-storefront"
    static_configs:
      - targets: ["php-storefront:8080"]
    metrics_path: "/metrics"

  - job_name: "ai-recommender"
    static_configs:
      - targets: ["ai-recommender:8000"]
    metrics_path: "/metrics"
